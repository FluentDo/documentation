<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Telemetry Forge Fully Managed Logs Card Image</title>
  <desc id="desc">Layered log stream symbol with managed check in Telemetry Forge brand colours.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f223d"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ed3c3"/>
      <stop offset="100%" stop-color="#1798a9"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="86" cy="80" r="24" fill="#2ed3c3" opacity="0.12"/>
  <circle cx="548" cy="284" r="34" fill="#2ed3c3" opacity="0.08"/>

  <g>
    <rect x="156" y="116" width="328" height="34" rx="17" fill="#17365c"/>
    <rect x="156" y="164" width="328" height="34" rx="17" fill="#1b426f"/>
    <rect x="156" y="212" width="328" height="34" rx="17" fill="#225082"/>

    <rect x="156" y="116" width="240" height="34" rx="17" fill="url(#accent)" opacity="0.88"/>
    <rect x="156" y="164" width="286" height="34" rx="17" fill="url(#accent)" opacity="0.78"/>
    <rect x="156" y="212" width="210" height="34" rx="17" fill="url(#accent)" opacity="0.68"/>
  </g>

  <circle cx="510" cy="98" r="34" fill="#17365c" stroke="#2ed3c3" stroke-width="4" stroke-opacity="0.8"/>
  <path d="M494 98l11 11 20-24" fill="none" stroke="#e8fbff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="46" y="318" fill="#d8ebf4" font-size="30" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700">Fully Managed Logs</text>
</svg>
